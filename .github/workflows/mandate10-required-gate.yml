name: Mandate 10 required gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-gate:
    name: Mandate 10 required gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v3.18.4

      - name: Add pinned dependency repositories
        run: |
          helm repo add opentelemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add jaeger https://jaegertracing.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana-community.github.io/helm-charts
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/

      - name: Build pinned chart dependencies
        run: helm dependency build .

      - name: Lint Production chart
        run: helm lint . -f values.yaml -f values-prod.yaml

      - name: Render Production with immutable service digests
        shell: bash
        run: |
          shopt -s nullglob
          digest_files=(service-digest/values-*.yaml)
          if (( ${#digest_files[@]} == 0 )); then
            echo "::error::No Production service digest overlays found."
            exit 1
          fi

          value_args=(-f values.yaml -f values-prod.yaml)
          for digest_file in "${digest_files[@]}"; do
            value_args+=(-f "${digest_file}")
          done

          helm template techx-corp . "${value_args[@]}" > /tmp/techx-corp-production.yaml
          if awk '
            /^[[:space:]]*image:/ &&
            /techx-prod-corp\// &&
            !/@sha256:/ { print; found=1 }
            END { exit found ? 0 : 1 }
          ' /tmp/techx-corp-production.yaml; then
            echo "::error::Production render contains an internal image referenced by tag."
            exit 1
          fi
          grep -q 'techx-prod-corp/.*@sha256:' /tmp/techx-corp-production.yaml
