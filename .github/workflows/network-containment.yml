name: Network containment verification

on:
  pull_request:
    paths:
      - ".github/workflows/network-containment.yml"
      - "templates/networkpolicy.yaml"
      - "templates/aiops.yaml"
      - "templates/aiops-live-executor.yaml"
      - "templates/egress-proxy.yaml"
      - "templates/_objects.tpl"
      - "templates/component.yaml"
      - "scripts/mandate17-*.ps1"
      - "tests/mandate17/**"
      - "scripts/mandate21-*.ps1"
      - "scripts/maintenance-load-test.js"
      - "tests/mandate21/**"
      - "grafana/provisioning/dashboards/mandate-21-*.json"
      - "gitops/linkerd/linkerd-control-plane.yaml"
      - "values.schema.json"
      - "values*.yaml"
      - "values-aiops-live-executor.yaml"
      - "secrets-chart/**"
      - "gitops/clusters/prod/application.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/network-containment.yml"
      - "templates/networkpolicy.yaml"
      - "templates/aiops.yaml"
      - "templates/aiops-live-executor.yaml"
      - "templates/egress-proxy.yaml"
      - "templates/_objects.tpl"
      - "templates/component.yaml"
      - "scripts/mandate17-*.ps1"
      - "tests/mandate17/**"
      - "scripts/mandate21-*.ps1"
      - "scripts/maintenance-load-test.js"
      - "tests/mandate21/**"
      - "grafana/provisioning/dashboards/mandate-21-*.json"
      - "gitops/linkerd/linkerd-control-plane.yaml"
      - "values.schema.json"
      - "values*.yaml"
      - "values-aiops-live-executor.yaml"
      - "secrets-chart/**"
      - "gitops/clusters/prod/application.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Build Helm dependencies
        run: |
          helm repo add opentelemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add jaeger https://jaegertracing.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana-community.github.io/helm-charts
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm dependency build .
      - name: Helm lint
        run: helm lint . -f values.yaml -f values-public-alb.yaml -f values-prod.yaml
      - name: Verify AIOps self-heal chart contract
        run: |
          set -euo pipefail
          helm lint . \
            -f values.yaml -f values-public-alb.yaml -f values-prod.yaml \
            -f values-aiops-live-executor.yaml

          if helm template techx-corp . \
            --namespace techx-corp-prod \
            -f values.yaml -f values-public-alb.yaml -f values-prod.yaml \
            -f values-aiops-live-executor.yaml \
            --set aiops.config.selfHeal.enabled=true >/tmp/aiops-invalid.yaml 2>/tmp/aiops-invalid.err; then
            echo "::error::self-heal rendered without live-approved policy and live apply"
            exit 1
          fi

          helm template techx-corp . \
            --namespace techx-corp-prod \
            -f values.yaml -f values-public-alb.yaml -f values-prod.yaml \
            -f values-aiops-live-executor.yaml \
            --set aiops.config.policyMode=live-approved \
            --set aiops.config.selfHeal.enabled=true \
            --set aiopsLiveExecutor.config.allowLiveApply=true \
            >/tmp/aiops-live.yaml

          yq -e 'select(.kind == "Deployment" and .metadata.name == "aiops-runtime") |
            .spec.template.spec.containers[0].env[] |
            select(.name == "AIOPS_SELF_HEAL_APPROVAL_ID")' /tmp/aiops-live.yaml >/dev/null
          yq -e 'select(.kind == "Deployment" and .metadata.name == "aiops-live-executor") |
            .spec.template.spec.containers[0].env[] |
            select(.name == "AIOPS_LIVE_EXECUTOR_APPROVAL_ID")' /tmp/aiops-live.yaml >/dev/null
          yq -e 'select(.kind == "Role" and .metadata.name == "aiops-live-executor-deployment-writer") |
            .rules[] | select(.resources[] == "horizontalpodautoscalers")' /tmp/aiops-live.yaml >/dev/null
          yq -e 'select(.kind == "NetworkPolicy" and .metadata.name == "aiops-runtime") |
            .spec.egress[] | select(.to[].podSelector.matchLabels."app.kubernetes.io/name" == "aiops-live-executor")' \
            /tmp/aiops-live.yaml >/dev/null
          yq -e 'select(.kind == "NetworkPolicy" and .metadata.name == "aiops-live-executor") |
            .spec.egress[] | select(.ports[].port == 443)' /tmp/aiops-live.yaml >/dev/null

          helm lint ./secrets-chart
          helm template techx-corp-secrets ./secrets-chart \
            --namespace techx-corp-prod \
            --set aiopsLiveExecutor.approvalEnabled=true \
            >/tmp/aiops-secrets.yaml
          yq -e 'select(.kind == "ExternalSecret" and .metadata.name == "aiops-live-executor-token") |
            .spec.data[] | select(.secretKey == "approval-id")' /tmp/aiops-secrets.yaml >/dev/null
      - name: Verify three-state containment manifests
        shell: pwsh
        run: ./tests/mandate17/verify-rendered-manifests.ps1
      - name: Verify identity and AZ regression
        shell: pwsh
        run: |
          ./scripts/mandate17-inventory.ps1
          ./scripts/verify-directive-03.ps1
      - name: Verify chaos script contracts
        shell: pwsh
        run: ./tests/mandate17/verify-chaos-scripts.ps1
      - name: Verify Mandate 21 runtime drill contracts
        shell: pwsh
        run: ./tests/mandate21/verify-runtime.ps1
      - name: Validate Envoy proxy configuration
        run: |
          helm template techx-corp . \
            --namespace techx-corp-prod \
            -f values.yaml -f values-public-alb.yaml -f values-prod.yaml \
            --set egressProxy.enabled=true \
            --show-only templates/egress-proxy.yaml > /tmp/egress-proxy.yaml
          yq 'select(.kind == "ConfigMap").data."envoy.yaml"' /tmp/egress-proxy.yaml > /tmp/envoy.yaml
          image="$(yq -r '.egressProxy.image.repository + ":" + .egressProxy.image.tag' values.yaml)"
          docker run --rm -v /tmp/envoy.yaml:/tmp/envoy.yaml:ro "${image}" \
            --mode validate -c /tmp/envoy.yaml
