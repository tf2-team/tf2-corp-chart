apiVersion: v1
kind: Pod
metadata:
  name: mandate10-unlisted-external
  namespace: mandate10-validation
  labels:
    app.kubernetes.io/name: mandate10-unlisted-test
    app.kubernetes.io/part-of: mandate10-evidence
  annotations:
    linkerd.io/inject: disabled
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: unlisted-external
      image: registry.k8s.io/pause:3.10
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
