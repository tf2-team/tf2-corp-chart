# Opt-in overlay for the self-heal live executor.
# Only enable in a dev/demo namespace approved for the executor allowlist.
# This overlay enables live Kubernetes mutation for controlled self-heal smoke tests.
aiopsLiveExecutor:
  enabled: true
  podAnnotations:
    config.linkerd.io/skip-outbound-ports: "443,10000,9901"
  image:
    digest: sha256:077bdfe6d1d67bbda5e0dd43e513ef5448f7b5c9e2b2a48e84e32b46dc8113f4
  auth:
    existingSecret: aiops-live-executor-token
    tokenKey: token
  config:
    allowLiveApply: "true"
