{{- $retention := .Values.opensearchLogRetention | default dict -}}
{{- if $retention.enabled }}
{{- $opensearch := .Values.components.opensearch | default dict -}}
{{- $image := dict "name" "opensearch" "imageOverride" (default dict $opensearch.imageOverride) "defaultValues" .Values.default "Chart" .Chart -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-log-retention
  labels:
    {{- include "techx-corp.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch-log-retention
data:
  apply-retention.sh: |
    #!/bin/sh
    set -eu

    endpoint="https://opensearch:9200"
    auth="${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}"

    request() {
      method="$1"
      path="$2"
      payload="${3:-}"
      if [ -n "$payload" ]; then
        curl -skS --connect-timeout 5 --max-time 20 --fail-with-body -u "$auth" -X "$method" \
          -H 'Content-Type: application/json' --data "$payload" "$endpoint$path"
      else
        curl -skS --connect-timeout 5 --max-time 20 --fail-with-body -u "$auth" -X "$method" "$endpoint$path"
      fi
    }

    wait_for_opensearch() {
      attempt=0
      until request GET '/_cluster/health?timeout=20s' >/dev/null 2>&1; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 60 ]; then
          echo 'OpenSearch did not become ready within five minutes' >&2
          exit 1
        fi
        sleep 5
      done
    }

    put_policy() {
      name="$1"
      pattern="$2"
      days="$3"
      payload=$(printf '{"policy":{"description":"M18 bounded OpenTelemetry log retention","default_state":"hot","states":[{"name":"hot","actions":[],"transitions":[{"state_name":"delete","conditions":{"min_index_age":"%sd"}}]},{"name":"delete","actions":[{"delete":{}}],"transitions":[]}],"ism_template":[{"index_patterns":["%s"],"priority":%s}]}}' "$days" "$pattern" "$4")

      # Updating an existing ISM policy requires its current version.
      metadata=$(curl -skS --connect-timeout 5 --max-time 20 -u "$auth" \
        "$endpoint/_plugins/_ism/policies/$name")
      seq_no=$(printf '%s' "$metadata" | sed -n 's/.*"_seq_no":\([0-9][0-9]*\).*/\1/p')
      primary_term=$(printf '%s' "$metadata" | sed -n 's/.*"_primary_term":\([0-9][0-9]*\).*/\1/p')
      query=""
      if [ -n "$seq_no" ] && [ -n "$primary_term" ]; then
        query="?if_seq_no=$seq_no&if_primary_term=$primary_term"
      fi
      request PUT "/_plugins/_ism/policies/$name$query" "$payload" >/dev/null
      echo "Applied $name: $pattern retained for ${days}d"
    }

    migrate_legacy_indices() {
      legacy_indices=$(curl -skS --connect-timeout 5 --max-time 20 -u "$auth" \
        "$endpoint/_cat/indices/otel-logs-20*?h=index" | awk 'NF { print $1 }')
      [ -n "$legacy_indices" ] || return 0

      for index in $legacy_indices; do
        request POST "/_plugins/_ism/change_policy/$index" \
          '{"policy_id":"otel-logs-standard-retention","state":"hot","include":[{"state":"hot"}]}' >/dev/null
      done

      # change_policy is asynchronous.  Do not remove the legacy policies
      # until every old index reports the replacement policy.
      attempt=0
      while :; do
        pending=0
        for index in $legacy_indices; do
          metadata=$(curl -skS --connect-timeout 5 --max-time 20 -u "$auth" \
            "$endpoint/_plugins/_ism/explain/$index")
          if ! printf '%s' "$metadata" | grep -q '"policy_id":"otel-logs-standard-retention"'; then
            pending=1
            break
          fi
        done
        [ "$pending" -eq 0 ] && return 0
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 50 ]; then
          echo 'Legacy OpenTelemetry log indexes did not migrate to the standard policy' >&2
          exit 1
        fi
        sleep 5
      done
    }

    delete_policy_if_present() {
      name="$1"
      metadata=$(curl -skS --connect-timeout 5 --max-time 20 -u "$auth" \
        "$endpoint/_plugins/_ism/policies/$name")
      if printf '%s' "$metadata" | grep -q '"_id"'; then
        request DELETE "/_plugins/_ism/policies/$name" >/dev/null
        echo "Removed legacy policy $name"
      fi
    }

    wait_for_opensearch
    put_policy otel-logs-transaction-retention 'otel-logs-transaction-*' '{{ $retention.transactionDays }}' 300
    put_policy otel-logs-error-retention 'otel-logs-error-*' '{{ $retention.errorDays }}' 200
    # Existing temporary policies match otel-logs-* at priorities 100 and 110.
    # Keep standard logs above those broad templates; error and transaction remain
    # more specific at 200 and 300 respectively.
    put_policy otel-logs-standard-retention 'otel-logs-standard-*' '{{ $retention.standardDays }}' 150

    # Existing unified indexes predate log classification.  Retain them as
    # standard logs, then remove the temporary broad policies used by M16/AIOps.
    migrate_legacy_indices
    delete_policy_if_present aiops-otel-logs-retention
    delete_policy_if_present m16-otel-logs-retention
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-log-retention
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    {{- include "techx-corp.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch-log-retention
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 360
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
      labels:
        {{- include "techx-corp.labels" . | nindent 8 }}
        app.kubernetes.io/component: opensearch-log-retention
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply-retention
          image: '{{ include "techx-corp.containerImage" $image }}'
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/apply-retention.sh"]
          env:
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: techx-corp-opensearch
                  key: username
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: techx-corp-opensearch
                  key: password
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: opensearch-log-retention
            defaultMode: 0444
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-log-retention
  labels:
    {{- include "techx-corp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opensearch-log-retention
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              opentelemetry.io/name: opensearch
      ports:
        - protocol: TCP
          port: 9200
{{- end }}
