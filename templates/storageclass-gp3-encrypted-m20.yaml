{{- if .Values.mandate20EbsBackup.enabled }}
{{- /*
  Mandate 20 StorageClass for newly provisioned production PVCs.
  It intentionally coexists with gp3-encrypted: StorageClass parameters and
  PVC storageClassName are immutable, so existing workloads migrate separately.
*/ -}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted-m20
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/part-of: techx-corp
    mandate.techx.io/id: "20"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
  tagSpecification_1: "Mandate20Backup=hourly"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
{{- end }}
