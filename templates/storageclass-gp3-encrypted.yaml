{{- /*
  Encrypted gp3 StorageClass for EBS CSI dynamic provisioning.
  parameters.encrypted forces at-rest encryption (alias/aws/ebs when account default KMS is used).
*/ -}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/part-of: techx-corp
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
  # EBS CSI applies this only to newly provisioned production volumes.
{{ if .Values.mandate20EbsBackup.enabled }}
  tagSpecification_1: "Mandate20Backup=hourly"
{{ end }}
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# Change trail: @hungxqt - 2026-07-27 - Tag new production EBS volumes for Mandate 20 hourly backup.
