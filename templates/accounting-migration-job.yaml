{{- if and .Values.components.accounting .Values.components.accounting.enabled }}
{{- $acct := .Values.components.accounting }}
{{- if eq (dig "migration" "enabled" false $acct) true }}
{{- $config := set (deepCopy $acct) "Capabilities" $.Capabilities }}
{{- $config := set $config "Template" $.Template }}
{{- $config := set $config "name" "accounting" }}
{{- $config := set $config "Release" $.Release }}
{{- $config := set $config "Chart" $.Chart }}
{{- $config := set $config "defaultValues" $.Values.default }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: accounting-migration-postgresql-egress
  labels:
    {{- include "techx-corp.labels" $config | nindent 4 }}
    app.kubernetes.io/component: accounting-migration
  annotations:
    # This retained PreSync hook is created one wave before the Job. Keeping it
    # until the next sync avoids a policy gap while the migration is running.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: accounting-migration
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            # RDS resolves to a private VPC address. Limit the one-shot client
            # to PostgreSQL instead of granting general internal egress.
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: accounting-migration
  labels:
    {{- include "techx-corp.labels" $config | nindent 4 }}
    app.kubernetes.io/component: accounting-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: techx-corp
        app.kubernetes.io/component: accounting-migration
      annotations:
        # A PreSync migration is a one-shot database client. A mesh sidecar
        # would keep the Pod alive after the migrator exits and can intercept
        # the initial PostgreSQL connection before the proxy is ready.
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: accounting-migration
          image: '{{ include "techx-corp.containerImage" $config }}'
          imagePullPolicy: {{ (($acct.imageOverride).pullPolicy) | default .Values.default.image.pullPolicy }}
          args:
            - "--migrate-only"
          env:
            # Migration mode must not initialize Kafka or the outbox reconciler.
            # If this container asks for KAFKA_ADDR, the promoted image does not
            # contain the required --migrate-only entry point and must fail closed.
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: techx-corp-postgresql-app
                  key: accounting-db-connection-string
          resources:
            {{- toYaml ($acct.resources | default .Values.default.resources) | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
{{- end }}
{{/* Change trail: Person 3 - 2026-07-29 - Keep the DB-only PreSync migration out of Linkerd and permit only PostgreSQL egress. */}}
