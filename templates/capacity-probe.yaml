{{- if .Values.capacityProbe.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-probe
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: capacity-probe
    app.kubernetes.io/component: karpenter-capacity-proof
    app.kubernetes.io/managed-by: Helm
    mandate21.techx.io/run-id: {{ .Values.capacityProbe.runId | quote }}
    mandate21.techx.io/evidence-id: {{ .Values.capacityProbe.evidenceId | quote }}
    mandate21.techx.io/source-revision: {{ .Values.capacityProbe.sourceRevision | quote }}
spec:
  replicas: {{ .Values.capacityProbe.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-probe
      mandate21.techx.io/run-id: {{ .Values.capacityProbe.runId | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-probe
        app.kubernetes.io/component: karpenter-capacity-proof
        mandate21.techx.io/run-id: {{ .Values.capacityProbe.runId | quote }}
        mandate21.techx.io/evidence-id: {{ .Values.capacityProbe.evidenceId | quote }}
        mandate21.techx.io/source-revision: {{ .Values.capacityProbe.sourceRevision | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        topology.kubernetes.io/zone: {{ .Values.capacityProbe.targetZone | quote }}
        karpenter.sh/capacity-type: "on-demand"
      tolerations:
        - key: "workload-class"
          operator: "Equal"
          value: "spot-tolerant"
          effect: "NoSchedule"
      containers:
        - name: capacity-probe
          image: "public.ecr.aws/docker/library/busybox:1.36.1"
          command: ["sleep", "3600"]
          resources:
            {{- toYaml .Values.capacityProbe.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
{{- end }}
