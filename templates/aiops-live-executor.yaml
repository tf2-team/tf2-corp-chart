{{- if .Values.aiopsLiveExecutor.enabled }}
{{- $name := "aiops-live-executor" }}
{{- $serviceAccountName := default $name .Values.aiopsLiveExecutor.serviceAccount.name }}
{{- $claimName := default (printf "%s-state" $name) .Values.aiopsLiveExecutor.persistence.existingClaim }}
{{- $repository := default (printf "%s/aiops" .Values.default.image.repository) .Values.aiopsLiveExecutor.image.repository }}
{{- $tag := default (default .Chart.AppVersion .Values.default.image.tag) .Values.aiopsLiveExecutor.image.tag }}
{{- $imageRef := printf "%s:%s" $repository $tag }}
{{- with .Values.aiopsLiveExecutor.image.digest }}
{{- $imageRef = printf "%s@%s" $repository . }}
{{- end }}
{{- if .Values.aiopsLiveExecutor.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aiops-live-executor
  {{- with .Values.aiopsLiveExecutor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
{{- end }}
{{- if and .Values.aiopsLiveExecutor.persistence.enabled (not .Values.aiopsLiveExecutor.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claimName }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aiops-live-executor
spec:
  accessModes:
    - {{ .Values.aiopsLiveExecutor.persistence.accessMode }}
  {{- with .Values.aiopsLiveExecutor.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.aiopsLiveExecutor.persistence.size }}
---
{{- end }}
{{- if .Values.aiopsLiveExecutor.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-deployment-writer
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aiops-live-executor
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      {{- range .Values.aiopsLiveExecutor.rbac.targetDeployments }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames:
      {{- range .Values.aiopsLiveExecutor.rbac.targetDeployments }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-deployment-writer
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aiops-live-executor
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-deployment-writer
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aiops-live-executor
spec:
  replicas: {{ .Values.aiopsLiveExecutor.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: aiops-live-executor
        opentelemetry.io/name: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.aiopsLiveExecutor.service.containerPort | quote }}
    spec:
      serviceAccountName: {{ $serviceAccountName }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $imageRef | quote }}
          imagePullPolicy: {{ .Values.aiopsLiveExecutor.image.pullPolicy }}
          command:
            - uvicorn
          args:
            - aiops.live_executor.app:create_app
            - --factory
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.aiopsLiveExecutor.service.containerPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.aiopsLiveExecutor.service.containerPort }}
              protocol: TCP
          env:
            - name: AIOPS_ENVIRONMENT
              value: {{ .Values.aiopsLiveExecutor.config.environment | quote }}
            - name: AIOPS_LIVE_EXECUTOR_STORE_PATH
              value: {{ .Values.aiopsLiveExecutor.config.storePath | quote }}
            - name: AIOPS_LIVE_EXECUTOR_POLICY_ID
              value: {{ .Values.aiopsLiveExecutor.config.policyId | quote }}
            - name: AIOPS_LIVE_EXECUTOR_POLICY_EXPIRES_AT
              value: {{ .Values.aiopsLiveExecutor.config.policyExpiresAt | quote }}
            - name: AIOPS_LIVE_EXECUTOR_ALLOW_LIVE_APPLY
              value: {{ .Values.aiopsLiveExecutor.config.allowLiveApply | quote }}
            - name: AIOPS_LIVE_EXECUTOR_COOLDOWN_SECONDS
              value: {{ .Values.aiopsLiveExecutor.config.cooldownSeconds | quote }}
            - name: AIOPS_LIVE_EXECUTOR_ACTION_BUDGET_WINDOW_SECONDS
              value: {{ .Values.aiopsLiveExecutor.config.actionBudgetWindowSeconds | quote }}
            - name: AIOPS_LIVE_EXECUTOR_ACTION_BUDGET_MAX_EXECUTIONS
              value: {{ .Values.aiopsLiveExecutor.config.actionBudgetMaxExecutions | quote }}
            - name: AIOPS_LIVE_EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiopsLiveExecutor.auth.existingSecret | quote }}
                  key: {{ .Values.aiopsLiveExecutor.auth.tokenKey | quote }}
            {{- if eq .Values.aiopsLiveExecutor.config.allowLiveApply "true" }}
            - name: AIOPS_LIVE_EXECUTOR_APPROVAL_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiopsLiveExecutor.auth.existingSecret | quote }}
                  key: {{ .Values.aiopsLiveExecutor.auth.approvalIdKey | quote }}
            {{- end }}
            - name: AIOPS_KUBERNETES_API_URL
              value: https://kubernetes.default.svc
            - name: AIOPS_KUBERNETES_BEARER_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            - name: AIOPS_KUBERNETES_CA_CERT_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          resources:
            {{- toYaml .Values.aiopsLiveExecutor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /app/state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          {{- if .Values.aiopsLiveExecutor.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $claimName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aiops-live-executor
  {{- with .Values.aiopsLiveExecutor.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.aiopsLiveExecutor.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.aiopsLiveExecutor.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aiops-live-executor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.enforceEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  {{- range .Values.aiopsLiveExecutor.networkPolicy.allowFrom }}
                  - {{ . | quote }}
                  {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.aiopsLiveExecutor.service.containerPort }}
  {{- if .Values.networkPolicy.enforceEgress }}
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.kubernetesApiCidr }}
      ports:
        - protocol: TCP
          port: 443
  {{- end }}
{{- end }}
{{- end }}
