# Production overlay for Argo CD / Helm GitOps (REL-09).
# Layer order: values.yaml → values-public-alb.yaml → values-prod.yaml
#
# Image contract: default.image.repository + default.image.tag is GLOBAL for all
# nested services including opensearch (…/techx-corp/<service>:<tag>).
# Promotion: full bake all services → verify every ECR tag → open PR → merge → Argo sync.
# Do not open a values-prod PR while image push is still in progress.
#
# Secrets (SEC-05): values.yaml uses secretKeyRef. Bootstrap ASM + deploy secrets-chart first.
# Do not commit real production credentials into this file.
# See docs/operations/external-secrets.md

externalSecrets:
  enabled: true
  namespace: techx-corp-prod

runtimeHardeningInventory:
  enabled: true

# Mandate 17 activation is intentionally split into later, reversible PRs.
networkPolicy:
  enabled: true
  enforceEgress: true
  # default/kubernetes ClusterIP verified live on 2026-07-22.
  kubernetesApiCidr: 172.20.0.1/32
  # Internal storefront ALB live subnets (verified 2026-07-21 via ELBv2/EC2).
  albIngressCidrs:
    - 10.0.10.0/24
    - 10.0.11.0/24

egressProxy:
  enabled: true
  callers:
    - checkout
    - grafana
    - product-reviews
    - shopping-copilot
    - yace
  allowedDomains:
    - api.groq.com:443
    - bedrock-runtime.us-east-1.amazonaws.com:443
    - sts.us-east-1.amazonaws.com:443
    - monitoring.us-east-1.amazonaws.com:443
    - logs.us-east-1.amazonaws.com:443
    # Lists in Helm overlays replace the base list, so keep every DynamoDB
    # endpoint required by the checkout durable outbox in this prod override.
    - dynamodb.us-east-1.amazonaws.com:443
    - 493499579600.ddb.us-east-1.amazonaws.com:443
    - "*.ddb.us-east-1.amazonaws.com:443"
    - athena.ap-southeast-1.amazonaws.com:443
    - glue.ap-southeast-1.amazonaws.com:443
    - sts.ap-southeast-1.amazonaws.com:443
    - s3.ap-southeast-1.amazonaws.com:443
    - "*.s3.ap-southeast-1.amazonaws.com:443"
    - s3.us-east-1.amazonaws.com:443
    - "*.s3.us-east-1.amazonaws.com:443"
    - s3.amazonaws.com:443
    - "*.s3.amazonaws.com:443"
    - discord.com:443
    - grafana.com:443
    - "*.grafana.com:443"
    # Grafana plugin installer downloads zip artifacts from Google Cloud Storage.
    - storage.googleapis.com:443





grafana:
  grafana.ini:
    server:
      # Alert links are generated outside an HTTP request, so the base
      # values.yaml macro can fall back to localhost. Pin prod to the private
      # operator URL used through Client VPN / internal ALB.
      domain: "internal.hungtran.id.vn"
      root_url: "https://internal.hungtran.id.vn/grafana"
      serve_from_sub_path: true





default:
  # Keep a bounded rollback window while admission policy prevents new violations.
  revisionHistoryLimit: 2
  # DIRECTIVE #3: stop routing first, then terminate. The native lifecycle sleep
  # works with distroless images because it does not execute a container binary.
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 10
  image:
    repository: 493499579600.dkr.ecr.us-east-1.amazonaws.com/techx-prod-corp
    # Replace with currently running tag before cutover (e.g. sha-a1b2c3d or v1.2.3).
    tag: "sha-61da855"
  # Production replicas must occupy distinct hosts and prefer both configured
  # AZs. Zone spread is soft so an AZ outage cannot block recovery; hostname
  # spread remains hard to avoid placing replicas on one node.
  schedulingRules:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      - maxSkew: 1
        minDomains: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule


mem0:
  # TEMPORARY: disable Mem0 workload (Deployment/Job/SA). Re-enable when ready.
  # secrets-chart Mem0 ExternalSecrets stay enabled (overlay unchanged).
  enabled: false
  awsRegion: us-east-1
  # Image: inherit default.image.repository/mem0:default.image.tag (platform chart promote).
  rds:
    host: "techx-prod-tf2-mem0-postgres.cijoii00i7pl.us-east-1.rds.amazonaws.com"
    port: 5432
    database: mem0
    appUser: mem0_app
  serviceAccount:
    name: mem0
    roleArn: "arn:aws:iam::493499579600:role/techx-prod-tf2-mem0-model-read"
  # K8s Secret *names* only (RFC 1123). ASM ARN/name lives in secrets-chart mem0.masterRemoteKey.
  runtimeSecretName: techx-corp-mem0
  masterSecretName: techx-corp-mem0-rds-master
  modelDelivery:
    enabled: true
    awsRegion: us-east-1
    # Composed as {{ s3Prefix }}/{{ default.image.tag }}/{{ archiveName }}.
    # Set platform MEM0_FASTEMBED_ARTIFACT_S3_URI to this s3Prefix so CI publishes under the global tag.
    s3Prefix: "s3://techx-prod-tf2-ai-models-493499579600/fastembed/paraphrase-multilingual-MiniLM-L12-v2"
    archiveName: fastembed-paraphrase-multilingual-MiniLM-L12-v2-faf4aa422582.tar.gz
    mountPath: /models/fastembed
components:
  # DIRECTIVE #3: keep at least two Ready instances for every stateless service
  # on the synchronous browse -> cart -> checkout path. HPA services use a
  # production floor of two; fixed-size services declare replicas explicitly.
  # Stateful dependencies require real replication/failover and must not be
  # made "HA" by starting independent writers against the same storage.
  ad:
    replicas: 2
    schedulingRules: &directive03-hard-spread
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
  cart:
    autoscaling:
      minReplicas: 2
    pdb:
      maxUnavailable: 1
    schedulingRules: *directive03-hard-spread
    # Linkerd CNI redirects init-container traffic before the proxy sidecar is
    # running. Bypass only the managed Valkey startup probe; retain the
    # namespace-level Envoy admin bypasses.
    podAnnotations:
      config.linkerd.io/skip-outbound-ports: "6379,10000,9901"
    envOverrides:
      # Stable private DNS (Route53 CNAME → ElastiCache primary). TCP-only init
      # proves reachability; the app must use TLS + AUTH (replication group has
      # transit_encryption_enabled and auth_token). Without them the process
      # hangs in StackExchange.Redis ConnectRetry and never binds :8080 →
      # liveness connection refused / readiness timeout.
      - name: VALKEY_ADDR
        value: valkey-cart.techx.internal:6379
      - name: VALKEY_TLS
        value: "true"
      # SslHost must match the ElastiCache certificate CN/SAN (AWS endpoint),
      # not the private CNAME. Update if the replication group is recreated:
      #   terraform -chdir=environments/production output -raw commerce_valkey_primary_endpoint
      - name: VALKEY_TLS_HOST
        value: master.techx-prod-tf2-cart.2bnsjq.use1.cache.amazonaws.com
      - name: VALKEY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: techx-corp-valkey-cart
            key: VALKEY_PASSWORD
    # Production uses the Terraform-managed Multi-AZ Valkey endpoint. Keep the
    # bounded startup gate, but target stable private DNS instead of the removed
    # in-cluster singleton Service.
    initContainers:
      - name: wait-for-managed-valkey
        image: busybox:1.37.0
        command: ["sh", "-c", "until nc -z -v -w5 valkey-cart.techx.internal 6379; do echo waiting for managed Valkey; sleep 2; done;"]
  checkout:
    autoscaling:
      minReplicas: 2
    pdb:
      maxUnavailable: 1
    schedulingRules: *directive03-hard-spread
    serviceAccount:
      create: true
      name: checkout
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::493499579600:role/techx-prod-tf2-checkout-outbox
    envOverrides:
      - name: CHECKOUT_OUTBOX_TABLE
        value: techx-prod-tf2-checkout-outbox
      - name: AWS_REGION
        value: us-east-1
      - name: KAFKA_ADDR
        valueFrom:
          secretKeyRef:
            name: techx-corp-msk
            key: KAFKA_ADDR
      - name: KAFKA_TLS
        value: "true"
      - name: KAFKA_SASL_USERNAME
        valueFrom: &msk-sasl-username
          secretKeyRef:
            name: techx-corp-msk
            key: KAFKA_SASL_USERNAME
      - name: KAFKA_SASL_PASSWORD
        valueFrom: &msk-sasl-password
          secretKeyRef:
            name: techx-corp-msk
            key: KAFKA_SASL_PASSWORD
    # Kafka is no longer a startup dependency. The durable outbox worker retries
    # publication after the checkout pod is Ready.
    initContainers: []
  
  accounting:
    serviceAccount:
      create: true
      name: accounting
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::493499579600:role/techx-prod-tf2-accounting-outbox-reconciler
    envOverrides:
      - name: CHECKOUT_OUTBOX_TABLE
        value: techx-prod-tf2-checkout-outbox
      - name: OUTBOX_RECONCILE_INTERVAL_SECONDS
        value: "300"
      - name: OUTBOX_PUBLISHED_STALE_SECONDS
        value: "900"
      - name: KAFKA_ADDR
        valueFrom:
          secretKeyRef:
            name: techx-corp-msk
            key: KAFKA_ADDR
      - name: KAFKA_TLS
        value: "true"
      - name: KAFKA_SASL_USERNAME
        valueFrom: *msk-sasl-username
      - name: KAFKA_SASL_PASSWORD
        valueFrom: *msk-sasl-password
    initContainers: []

  fraud-detection:
    envOverrides:
      - name: KAFKA_ADDR
        valueFrom:
          secretKeyRef:
            name: techx-corp-msk
            key: KAFKA_ADDR
      - name: KAFKA_TLS
        value: "true"
      - name: KAFKA_SASL_USERNAME
        valueFrom: *msk-sasl-username
      - name: KAFKA_SASL_PASSWORD
        valueFrom: *msk-sasl-password
      - name: REDIS_ADDR
        value: valkey-cart.techx.internal:6379
      - name: VALKEY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: techx-corp-valkey-cart
            key: VALKEY_PASSWORD
    initContainers: []

  currency:
    autoscaling:
      # Floor 3 pods: concurrent Convert from multi-item checkout (errgroup) needs headroom
      # beyond HPA RPS/CPU averages (those stay low while Convert p99 is multi-second).
      minReplicas: 2
    schedulingRules: *directive03-hard-spread
  email:
    replicas: 2
    schedulingRules: *directive03-hard-spread

  flagd:
    # Singleton control plane on Critical MNG (system-* / workload-class=critical).
    # Not on the Directive #3 two-replica money-path floor: load is tiny, BTC HTTP
    # is authoritative for chaos keys, and multi-replica emptyDir splits local-* UI.
    replicas: 1
    # Dual sources: local ConfigMap file + BTC central HTTP.
    # Merge order: later source wins on key clash — HTTP last so BTC always wins
    # for shared original keys (paymentFailure, cartFailure, …).
    # Local file / flagd-ui: local-* keys only (no BTC original names in UI).
    # Team self-test: toggle local-* in /feature (apps OR/max with BTC keys).
    # flagd-ui: inherit base values.yaml sidecar (writes local file only).
    # Access: /feature via internal ALB / Client VPN (CloudFront blocks /feature).
    # Requires ESO Secret techx-corp-flagd-ui (SECRET_KEY_BASE and FLAGD_SYNC_TOKEN).
    envOverrides:
      - name: FLAGD_SYNC_TOKEN
        valueFrom:
          secretKeyRef:
            name: techx-corp-flagd-ui
            key: FLAGD_SYNC_TOKEN
    command:
      - "/flagd-build"
      - "start"
      - "--port"
      - "8013"
      - "--ofrep-port"
      - "8016"
      - "--sources"
      - '[{"uri":"/etc/flagd/demo.flagd.json","provider":"file"},{"uri":"https://122.248.223.194.sslip.io/flags.json","provider":"http","authHeader":"Bearer $(FLAGD_SYNC_TOKEN)"}]'
    # Pin Critical MNG only; clear spreads (singleton does not need multi-host HA).
    schedulingRules:
      nodeSelector:
        workload-class: critical
      affinity: {}
      tolerations: []
      topologySpreadConstraints: []

  frontend:
    optionalDependencyTimeoutMs: 500
    autoscaling:
      # Keep enough storefront headroom for a node drain without letting noisy
      # RPS metrics drive the Deployment past the current Karpenter envelope.
      minReplicas: 3
      maxReplicas: 18
      targetCPUUtilizationPercentage: 80
      # Spanmetrics counts all frontend server spans; production incidents saw
      # the previous 80 RPS/pod target double desired replicas into Pending.
      # 180 keeps the target aligned with observed 150-200 user steady load.
      targetRequestsPerSecond: 180
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
            - type: Percent
              value: 25
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
    schedulingRules:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway

  frontend-proxy:
    publicAlb:
      # Internal ALB; path blocking is on CloudFront (infra cloudfront_block_sensitive_paths).
      scheme: internal
      blockSensitivePaths: false
      # HTTPS for operator private DNS (https://internal.hungtran.id.vn/...).
      # Set to the same ACM ARN as techx-corp-infra production:
      #   private_dns_acm_certificate_arn
      # Template enables HTTP:80 + HTTPS:443 when non-empty. Keep CloudFront on :80.
      # Do NOT enable ssl-redirect. See techx-corp-infra docs/client-vpn.md (TLS section).
      # certificateArn: "arn:aws:acm:us-east-1:493499579600:certificate/<ID>"
      certificateArn: "arn:aws:acm:us-east-1:493499579600:certificate/043175b8-99f5-492f-a258-ff280e0b9a75"
    autoscaling:
      minReplicas: 2
    # Preserve the critical MNG pin from values.yaml, but prefer separate AZs
    # and hosts. Hard spread prevents both ingress replicas sharing one node/AZ.
    schedulingRules: *directive03-hard-spread

  image-provider:
    replicas: 2
    schedulingRules: *directive03-hard-spread
  payment:
    replicas: 2
    schedulingRules: *directive03-hard-spread
  product-catalog:
    autoscaling:
      minReplicas: 2
    schedulingRules: *directive03-hard-spread
    initContainers: []
  product-reviews:
    autoscaling:
      minReplicas: 2
    schedulingRules: *directive03-hard-spread
    envOverrides:
      - name: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - name: LLM_MODEL
        value: openai/gpt-oss-20b
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::493499579600:role/techx-prod-tf2-product-reviews-model-read
    modelDelivery:
      s3Uri: s3://techx-prod-tf2-ai-models-493499579600/protectai/deberta-v3-base-prompt-injection-v2/89b085cd330414d3e7d9dd787870f315957e1e9f/artifacts/c6197e30a2dd6dd6ce7488cc775c7ae3f10b21df29192c085992f75befeedc50/model.tar.gz
    initContainers: []
  shopping-copilot:
    # The promoted platform image and IRSA policy are ready for Bedrock Nova.
    enabled: true
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::493499579600:role/techx-prod-tf2-shopping-copilot-model-read
    modelDelivery:
      s3Uri: s3://techx-prod-tf2-ai-models-493499579600/protectai/deberta-v3-base-prompt-injection-v2/89b085cd330414d3e7d9dd787870f315957e1e9f/artifacts/c6197e30a2dd6dd6ce7488cc775c7ae3f10b21df29192c085992f75befeedc50/model.tar.gz
  quote:
    autoscaling:
      minReplicas: 2
    schedulingRules: *directive03-hard-spread
  recommendation:
    autoscaling:
      minReplicas: 2
    schedulingRules: *directive03-hard-spread
  shipping:
    autoscaling:
      minReplicas: 2
    schedulingRules: *directive03-hard-spread
  postgresql:
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - max_connections=200
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4

  # Locust distributed: keep master up while active load testing (base values idle at 0).
  # Scale back to 0 when tests stop to save Spot capacity.
  load-generator:
    replicas: 1
    # Keep shared storefront load tests running while Groq quota is constrained.
    # The matching task is tagged in the load-generator image.
    envOverrides:
      - name: LOCUST_EXCLUDE_TAGS
        value: ai

  # Production cart state is provided by ElastiCache Valkey with a primary and
  # replica in different AZs plus automatic failover. Development keeps the
  # in-cluster singleton for cost-efficient local testing.
  valkey-cart:
    enabled: false

  # Production Kafka state is provided by Amazon MSK in private subnets.
  # Development keeps the in-cluster singleton for cost-efficient testing.
  kafka:
    enabled: false

  postgresql:
    enabled: false
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - max_connections=200
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    service:
      port: 5432
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  load-generator-worker:
    envOverrides:
      - name: LOCUST_EXCLUDE_TAGS
        value: ai
    # Enable the bounded handoff load-test worker pool. Keep Locust users/ramp
    # controlled from the master UI; workers only provide distributed capacity.
    replicas: 10
    autoscaling:
      enabled: false

  # CloudWatch metrics exporter for the managed data stores (Directive-08):
  # AWS/RDS, AWS/ElastiCache, AWS/Kafka host metrics become aws_* series in
  # Prometheus for AIOps RCA. Static jobs with fixed dimension tuples — if a
  # broker/replica count changes in Terraform, update the config below.
  # CloudWatch API reached only via egress-proxy (see egressProxy.callers).
  yace:
    enabled: true
    useDefault:
      env: false
    replicas: 1
    serviceAccount:
      create: true
      name: yace
      annotations:
        # techx-corp-infra module.yace_cloudwatch (apply infra before merge).
        eks.amazonaws.com/role-arn: arn:aws:iam::493499579600:role/techx-prod-tf2-yace-cloudwatch-read
    imageOverride:
      repository: quay.io/prometheuscommunity/yet-another-cloudwatch-exporter
      tag: v0.67.0
      digest: sha256:404791bf0b2f6efc0773f1cb65f314e6205cac3521064ce1b9d640f5bb268cfb
    # Default listen-address is loopback; bind all interfaces so the OTel
    # DaemonSet agent can scrape :5000 via annotation discovery.
    command:
      - /bin/yace
      - --config.file=/etc/yace/config.yml
      - --listen-address=:5000
    ports:
      - name: metrics
        value: 5000
    env:
      - name: AWS_REGION
        value: us-east-1
      # Regional STS is on the egress-proxy allowlist; global sts is not.
      - name: AWS_STS_REGIONAL_ENDPOINTS
        value: regional
    podAnnotations:
      io.opentelemetry.discovery.metrics/enabled: "true"
      io.opentelemetry.discovery.metrics/scraper: prometheus_simple
      io.opentelemetry.discovery.metrics/config: |
        collection_interval: 60s
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: 5000
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: /healthz
        port: 5000
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    mountedConfigMaps:
      - name: yace-config
        mountPath: /etc/yace
        data:
          # 300s period matches CloudWatch standard-resolution granularity and
          # keeps GetMetricData cost ~$3-4/month; the 60s pod scrape only
          # re-reads cached values.
          config.yml: |
            apiVersion: v1alpha1
            sts-region: us-east-1
            static:
              - namespace: AWS/RDS
                name: techx-prod-rds-postgresql
                regions: [us-east-1]
                dimensions:
                  - name: DBInstanceIdentifier
                    value: techx-prod-tf2-postgresql
                metrics:
                  - name: CPUUtilization
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: DatabaseConnections
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: FreeableMemory
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: FreeStorageSpace
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: ReadIOPS
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: WriteIOPS
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: ReadLatency
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: WriteLatency
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: NetworkReceiveThroughput
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: NetworkTransmitThroughput
                    statistics: [Average]
                    period: 300
                    length: 300
              - namespace: AWS/ElastiCache
                name: techx-prod-valkey-cart-001
                regions: [us-east-1]
                dimensions:
                  - name: CacheClusterId
                    value: techx-prod-tf2-cart-001
                  - name: CacheNodeId
                    value: "0001"
                metrics: &elasticache-metrics
                  - name: CPUUtilization
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: EngineCPUUtilization
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: NetworkBytesIn
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: NetworkBytesOut
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: CurrConnections
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: DatabaseMemoryUsagePercentage
                    statistics: [Average]
                    period: 300
                    length: 300
              - namespace: AWS/ElastiCache
                name: techx-prod-valkey-cart-002
                regions: [us-east-1]
                dimensions:
                  - name: CacheClusterId
                    value: techx-prod-tf2-cart-002
                  - name: CacheNodeId
                    value: "0001"
                metrics: *elasticache-metrics
              - namespace: AWS/Kafka
                name: techx-prod-msk-broker-1
                regions: [us-east-1]
                dimensions:
                  - name: Cluster Name
                    value: techx-prod-tf2-msk
                  - name: Broker ID
                    value: "1"
                metrics: &msk-metrics
                  - name: CpuUser
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: CpuSystem
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: CpuIdle
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: MemoryUsed
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: KafkaDataLogsDiskUsed
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: BytesInPerSec
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: BytesOutPerSec
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: NetworkRxPackets
                    statistics: [Average]
                    period: 300
                    length: 300
                  - name: NetworkTxPackets
                    statistics: [Average]
                    period: 300
                    length: 300
              - namespace: AWS/Kafka
                name: techx-prod-msk-broker-2
                regions: [us-east-1]
                dimensions:
                  - name: Cluster Name
                    value: techx-prod-tf2-msk
                  - name: Broker ID
                    value: "2"
                metrics: *msk-metrics

# Explicit production APM resource context (same as values.yaml defaults).
# Ensures prod overlay does not inherit a future base-values drift unintentionally.
# Arrays replace under Helm merge — keep the full attributes list.
prometheus:
  server:
    podAnnotations:
      linkerd.io/inject: disabled
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      scrape_timeout: 10s
    retention: 24h
  kube-state-metrics:
    podAnnotations:
      linkerd.io/inject: disabled
    nodeSelector:
      workload-class: critical

grafana:
  podAnnotations:
    linkerd.io/inject: disabled
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  env:
    HTTPS_PROXY: "http://egress-proxy:10000"
    https_proxy: "http://egress-proxy:10000"
    NO_PROXY: ".svc,.svc.cluster.local,localhost,127.0.0.1,10.0.0.0/8,opensearch"
    no_proxy: ".svc,.svc.cluster.local,localhost,127.0.0.1,10.0.0.0/8,opensearch"



  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::493499579600:role/techx-prod-tf2-grafana-athena

metrics-server:
  podAnnotations:
    linkerd.io/inject: disabled

prometheus-adapter:
  podAnnotations:
    linkerd.io/inject: disabled

jaeger:
  podAnnotations:
    linkerd.io/inject: disabled


opentelemetry-collector:
  # Kafka observability follows MSK. Restate OpenSearch envs because Helm
  # replaces arrays in overlays.
  extraEnvs:
    - name: OPENSEARCH_USERNAME
      valueFrom:
        secretKeyRef:
          name: techx-corp-opensearch
          key: username
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: techx-corp-opensearch
          key: password
    - name: KAFKA_BROKER_0
      valueFrom:
        secretKeyRef:
          name: techx-corp-msk
          key: KAFKA_BROKER_0
    - name: KAFKA_BROKER_1
      valueFrom:
        secretKeyRef:
          name: techx-corp-msk
          key: KAFKA_BROKER_1
    - name: KAFKA_SASL_USERNAME
      valueFrom:
        secretKeyRef:
          name: techx-corp-msk
          key: KAFKA_SASL_USERNAME
    - name: KAFKA_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: techx-corp-msk
          key: KAFKA_SASL_PASSWORD
    # Managed ElastiCache Valkey INFO scrape (promoted from the temporary
    # AIOps long-run overlay so the RCA metric set survives overlay removal).
    - name: VALKEY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: techx-corp-valkey-cart
          key: VALKEY_PASSWORD
    # Managed RDS PostgreSQL stats scrape credentials. Reuses the ESO-synced
    # application secret; the RDS endpoint itself is not a standalone secret
    # key (only embedded in DSNs), so the receiver hardcodes the hostname.
    - name: POSTGRES_MON_USER
      valueFrom:
        secretKeyRef:
          name: techx-corp-postgresql-app
          key: username
    - name: POSTGRES_MON_PASSWORD
      valueFrom:
        secretKeyRef:
          name: techx-corp-postgresql-app
          key: password
    - name: POSTGRES_MON_DB
      valueFrom:
        secretKeyRef:
          name: techx-corp-postgresql-app
          key: database
  config:
    receivers:
      kafkametrics:
        brokers:
          - ${env:KAFKA_BROKER_0}
          - ${env:KAFKA_BROKER_1}
        protocol_version: 3.7.0
        auth:
          sasl:
            username: ${env:KAFKA_SASL_USERNAME}
            password: ${env:KAFKA_SASL_PASSWORD}
            mechanism: SCRAM-SHA-512
        tls:
          insecure: false
      # Production Valkey is ElastiCache, not the disabled in-cluster pod;
      # annotation discovery cannot collect its INFO metrics. Promoted from
      # the AIOps long-run overlay (which may still tighten the interval).
      redis/valkey-cart:
        endpoint: master.techx-prod-tf2-cart.2bnsjq.use1.cache.amazonaws.com:6379
        password: ${env:VALKEY_PASSWORD}
        collection_interval: 30s
        tls:
          insecure: false
      # Production PostgreSQL is RDS (Directive-08 cutover); the in-cluster
      # pod and its annotation-discovery scraper are disabled. 60s interval:
      # every DaemonSet agent opens its own connection per cycle.
      postgresql/rds:
        endpoint: techx-prod-tf2-postgresql.cijoii00i7pl.us-east-1.rds.amazonaws.com:5432
        transport: tcp
        username: ${env:POSTGRES_MON_USER}
        password: ${env:POSTGRES_MON_PASSWORD}
        databases:
          - ${env:POSTGRES_MON_DB}
        collection_interval: 60s
        tls:
          # rds.force_ssl=1 requires TLS; app DSNs use sslmode=require
          # without CA pinning, mirrored here.
          insecure: false
          insecure_skip_verify: true
    processors:
      resource:
        attributes:
        - key: service.instance.id
          from_attribute: k8s.pod.uid
          action: insert
        - key: deployment.environment.name
          value: production
          action: upsert
        - key: service.namespace
          value: techx-corp-prod
          action: upsert
    service:
      pipelines:
        metrics:
          # Helm replaces arrays: restate the FULL base receiver list plus the
          # managed-store receivers. The AIOps long-run overlay restates the
          # same list; keep both in sync while the overlay is active.
          receivers: [otlp, kafkametrics, spanmetrics, redis/valkey-cart, postgresql/rds]

# Change trail: @hungxqt - 2026-07-26 - Managed-store collector receivers and yace CloudWatch exporter for AIOps RCA metrics.
